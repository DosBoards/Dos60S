name: Sync qmk → master

on:
  push:
    branches:
      - qmk

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge qmk into master/qmk/dosboards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Make sure master is present
          git fetch origin master
          git checkout master

          # Merge qmk branch into the subfolder
          git subtree merge --prefix=qmk/dosboards origin/qmk -m "Sync qmk → master"

          # Push result back
          git push origin master
